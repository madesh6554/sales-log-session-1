<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeLite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="page-header">
      <h1>ForgeLite</h1>
      <p class="subtitle">Sales log</p>
    </header>

    <section class="card stat">
      <p class="stat-label">This month</p>
      <p class="stat-value" id="month-total">—</p>
    </section>

    <form id="sale-form" class="card" novalidate>
      <div class="grid">
        <div class="field">
          <label for="customerName">Customer name</label>
          <input id="customerName" name="customerName" type="text" autocomplete="off" aria-describedby="customerName-error">
          <p class="error" id="customerName-error"></p>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="off">
        </div>

        <div class="field">
          <label for="item">Item</label>
          <input id="item" name="item" type="text" autocomplete="off" aria-describedby="item-error">
          <p class="error" id="item-error"></p>
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" aria-describedby="amount-error">
          <p class="error" id="amount-error"></p>
        </div>

        <div class="field">
          <label for="saleDate">Date</label>
          <input id="saleDate" name="saleDate" type="date">
        </div>

        <div class="field">
          <label for="source">Source</label>
          <input id="source" name="source" type="text" autocomplete="off">
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="save">Save</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </form>

    <section id="sales" class="card">
      <h2>Sales</h2>

      <div class="filters">
        <div class="filter-field">
          <label for="fromDate">From</label>
          <input id="fromDate" type="date">
        </div>

        <div class="filter-field">
          <label for="toDate">To</label>
          <input id="toDate" type="date">
        </div>

        <button type="button" id="apply">Apply</button>
        <button type="button" id="this-month" class="secondary">This month</button>
      </div>

      <p class="empty" id="empty">No sales yet</p>
      <table id="sales-table" hidden>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Customer</th>
            <th scope="col">Item</th>
            <th scope="col" class="numeric">Amount</th>
            <th scope="col">Source</th>
          </tr>
        </thead>
        <tbody id="sales-body"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
